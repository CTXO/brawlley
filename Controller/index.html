<!DOCTYPE html>
<html>
<head>
    <title>Game Controller</title>
    <style>
        /* Style your buttons for mobile */
		body {
			min-height: 100vh;
			box-sizing: border-box;
		}
		.hidden {
			display: none;
		}
		.button-container {
			display: flex;
			align-items: center;
		}

		.button-container .container {
			display: flex;
			align-items: center;
		}

		.left-button-container {
			display: flex;
			position: relative;
			width: 45%;
			border: 1px red solid;
			gap: 10px;

		}

		.right-button-container {
			display: flex;
			flex-direction: column;
			gap: 10px;
			border: 1px blue solid;
			margin-left: auto;
			align-items: center;

		}

		.button-row {
			display: flex;
			justify-content: center;
			gap: 20px;
		}

		.first-row {

		}


		.y-buttons {
			display: flex;
			flex-direction: column;
			justify-content: space-between;
			gap: 20px;
			margin-top: -20px;
		}
		
		button {
			width: 100px;
			aspect-ratio: 1/1;
		}

        button {
            font-size: 24px;
        }
    </style>
</head>
<body>
	<h1 id="title">Title</h1>
	<div class="hidden" style="display: none;">Pressing</div>

	<div class="button-container">
		<div class="left-button-container">
			<div class="left container">
				<button id="left-button" class="controller-button" data-x="-1" data-y="0">LEFT</button>
			</div>
			<div class="y-buttons">
				<button id="up-button" class="controller-button" data-x="0" data-y="1">UP</button>
				<button id="down-button" class="controller-button" data-x="0" data-y="-1" >DOWN</button>
			</div>
			<div class="right container">
				<button id="right-button" class="controller-button" data-x="1" data-y="0">RIGHT</button>
			</div>
		</div>
		<div class="right-button-container">
			<div class="buttton-row first-row">
				<button id="melee-button" class="controller-button">MELEE</button>
				<button id="block-button" class="controller-button">BLOCK</button>
			</div>
			<div class="buttton-row second-row">
				<button id="cast-button" class="controller-button">CAST</button>
				<button id="dash-button" class="controller-button">DASH</button>
			</div>
			<div class="buttton-row third-row">
				<button id="jump-button" class="controller-button">JUMP</button>

			</div>



		</div>
	</div>

    <script>

			"left-button": 0x03,   // MoveLeft
			"right-button": 0x04,  // MoveRight
			"up-button": 0x01,     // MoveUp
			"down-button": 0x02,   // MoveDown
			"melee-button": 0x0E,  // Melee
			"block-button": 0x0B,  // Parry (Blocking)
			"cast-button": 0x0C,   // SpellStart
			"dash-button": 0x0A,   // Dash
			"jump-button": 0x09    // Jump
		};


		const stopCodes = {
			"left-button": 0x07,  // StopMoveLeft
			"right-button": 0x08, // StopMoveRight
			"up-button": 0x05,    // StopMoveUp
			"down-button": 0x06   // StopMoveDown
		};

            console.error("WebSocket error:", event);

        function send(event, command) {
			console.log(event)
			console.log(command)
            if (socket.readyState === WebSocket.OPEN) {
				console.log("sent command", command)
                socket.send("MoveLeft");
            }
        }

		let frameIds = {0: 0, 1: 0, 2: 0, 3: 0}
		function pressButton(buffer, index) {
			if (socket.readyState === WebSocket.OPEN) {
				socket.send(buffer)
			}
			frameIds[index] = requestAnimationFrame(pressButton.bind(null, buffer, index))
		}

		const controllerButtons = document.querySelectorAll('.controller-button')
		const pressingElement = document.querySelector('.hidden')
		const downEvent = (i, event) => {
			console.log("mouse down")
			const xString = event.target.getAttribute("data-x");
			const yString = event.target.getAttribute("data-y");
			const x = parseInt(xString);
			const y = parseInt(yString);
			const code = buttonMapping[event.target.id];
			if (code === undefined) {
				return;
			}
			const buffer = new ArrayBuffer(1);
			const dataView = new DataView(buffer);

			dataView.setUint8(0, code);
			pressFunction = pressButton.bind(null, buffer, i)
			frameIds[i] = requestAnimationFrame(pressFunction);
			pressingElement.classList.remove('hidden');
		}

		const upEvent = (i, event) => {
			const frameId = frameIds[i]
			if (frameId) {
				console.log("cancel frame", frameId)
				cancelAnimationFrame(frameId)
				stopCode = stopCodes[event.target.id];
				if (stopCode === undefined) {
					return;
				}
				const buffer = new ArrayBuffer(1);
				const dataView = new DataView(buffer);
				dataView.setUint8(0, stopCode);

				if (socket.readyState === WebSocket.OPEN) {
					socket.send(buffer);
					pressingElement.classList.add('hidden');
				}
			}
		}
		controllerButtons.forEach((button, i) => {
			downEventBind = downEvent.bind(this, i)
			upEventBind = upEvent.bind(this, i)
			button.addEventListener('mousedown', downEventBind)
			button.addEventListener('mouseup', upEventBind);
			button.addEventListener('touchstart', downEventBind);
			button.addEventListener('touchend', upEventBind);
		})
